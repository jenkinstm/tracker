name: Deploy

# Деплой руками с кнопки или после зелёного CI на main.
# Собирается образ, пушится в ghcr.io, сервер его тянет.
# На сервере ничего не собирается: 2 ГБ RAM не хватит на vite build.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    # После workflow_run проверяем, что CI был зелёный: иначе выкатим сломанное.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$IMAGE:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "repo=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Выкатка на сервер
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            # Бэкап перед выкаткой: миграция может оказаться необратимой.
            # На первом деплое прод-базы ещё нет — снимать нечего, и падать
            # из-за этого нельзя, иначе выкатка не состоится ни разу.
            if docker compose -f docker-compose.prod.yml ps --status running --services 2>/dev/null | grep -qx db; then
              ./scripts/backup.sh
            else
              echo "прод-база не запущена — первый деплой, бэкап пропускаю"
            fi

            git fetch --all
            git reset --hard origin/main

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export APP_IMAGE=${{ needs.build.outputs.image }}

            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d

            # Ждём, пока healthcheck подтвердит, что приложение поднялось.
            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' tracker-app-1)" = "healthy" ]; then
                echo "приложение здорово"
                docker image prune -f
                exit 0
              fi
              sleep 5
            done

            echo "приложение не поднялось за 150 секунд" >&2
            docker compose -f docker-compose.prod.yml logs --tail 100 app >&2
            exit 1
