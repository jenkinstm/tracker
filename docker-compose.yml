services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rankpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужно задать в .env}
      POSTGRES_DB: ${POSTGRES_DB:-rankpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rankpulse}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    env_file: .env
    depends_on:
      api: { condition: service_healthy }
    command: celery -A app.tasks.celery_app.celery_app worker -l info --concurrency 4

  beat:
    build: ./backend
    env_file: .env
    depends_on:
      api: { condition: service_healthy }
    # Опрашивальщик отложенных операций живёт здесь: результат Search API
    # хранится 12 часов, не забрали — деньги списаны, данных нет.
    command: celery -A app.tasks.celery_app.celery_app beat -l info

  frontend:
    build: ./frontend
    env_file: .env
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  redisdata:
