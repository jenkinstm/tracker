name: tracker

# Прод: docker compose -f docker-compose.prod.yml up -d
#
# Образ приложения собирается в CI и тянется из registry — на сервере
# ничего не собирается (2 ГБ RAM не хватит на vite build).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Значения с $ (argon2id-хеш) обязаны быть в .env в одинарных кавычках:
    # иначе compose интерполирует их и подставляет пустоту.
    env_file: [.env]
    # Только expose: ufw не фильтрует порты, опубликованные докером,
    # и `ports:` выставил бы базу в интернет.
    expose: ['5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    image: ${APP_IMAGE:-ghcr.io/OWNER/tracker:latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: '3000'
      # За Caddy заголовкам X-Forwarded-* можно доверять.
      TRUST_PROXY: 'true'
      COOKIE_SECURE: 'true'
    expose: ['3000']
    volumes:
      # Фото прогресса (FR-4.7) лежат вне webroot — NFR-5.
      - photos:/app/data/photos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: [.env]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  photos:
  caddy-data:
  caddy-config:
  caddy-logs:
